name = "atf-demo-aauth-dev"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Opt in to the account-level Workers Trace Events Logpush job (forensic
# archive). Per-worker opt-in is required — without this the account job
# ignores the worker.
logpush = true

[observability]
enabled = true

[vars]
ORIGIN = "https://atf-demo.aauth.dev"
# The summit agent provider. Comma-separated to add others.
AGENT_PROVIDERS = "https://verifiable-agent-summit-provider.vercel.app,https://dickhardt.github.io"
# "bare" (AAuth as written) or "params" (atf-* on the challenge). See src/atf.ts.
ATF_CHALLENGE_CARRIER = "bare"

[[queues.producers]]
queue = "aauth-events"
binding = "EVENTS_QUEUE"

# Revoked agent tokens, keyed (iss, jti) per AAuth §Token Revocation. Each
# entry carries a KV TTL sized from the revoked token's own exp when the
# revoking call supplies one, and 24 hours when it does not — the request
# body has no exp field in AAuth as written (spec issue #146).
[[kv_namespaces]]
binding = "REVOCATIONS"
id = "1fbb4f2f2ee14c1ea2236c2e4172b0f3"

# ── Local development ──
#
# The custom-domain route lives under [env.production], not at the top level.
# `wrangler dev` rewrites the request authority to a top-level route pattern,
# so the worker would see `atf-demo.aauth.dev` while the client signed
# `localhost:8787` — and `@authority` is a covered component, so every
# signature would fail to verify. Deploy with `--env production`.
#
# The harness writes .dev.vars with AGENT_PROVIDER_JWKS pointing at the local
# agent provider it stands up; that file is gitignored and never deployed.

[env.production]
vars = { ORIGIN = "https://atf-demo.aauth.dev", AGENT_PROVIDERS = "https://verifiable-agent-summit-provider.vercel.app,https://dickhardt.github.io", ATF_CHALLENGE_CARRIER = "bare" }

[[env.production.routes]]
pattern = "atf-demo.aauth.dev"
custom_domain = true

# No agent provider is deployed anywhere in this project. Local runs use an
# unresolvable issuer plus AGENT_PROVIDER_JWKS; live runs mint as
# https://dickhardt.github.io, whose JWKS has been published since June.
# See harness/enclave.mjs.

[[env.production.queues.producers]]
queue = "aauth-events"
binding = "EVENTS_QUEUE"

[[env.production.kv_namespaces]]
binding = "REVOCATIONS"
id = "1fbb4f2f2ee14c1ea2236c2e4172b0f3"
