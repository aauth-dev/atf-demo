# The test agent provider's public half — a separate Worker on a separate
# hostname. See the note at the top of worker.mjs for why it cannot live in
# the resource's worker: a Worker cannot subrequest its own route.

name = "atf-demo-ap"
main = "worker.mjs"
compatibility_date = "2025-04-01"

[observability]
enabled = true

[[routes]]
pattern = "ap.atf-demo.aauth.dev"
custom_domain = true
